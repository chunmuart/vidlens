# 与 docker-compose.yml 合并使用，提供本地网页入口并控制 RocketMQ 内存。
services:
  redis:
    # 本机已有 Memurai 使用 6379；容器内仍通过 redis:6379 访问。
    ports: !override
      - "127.0.0.1:6380:6379"

  rmqnamesrv:
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx256m -Xmn96m"

  rmqbroker:
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx768m -Xmn256m"

  api:
    image: vidlens-backend:local
    environment:
      ROOT_PATH: /api
      CORS_ALLOWED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
      EVIDENCE_RETRIEVER_PROFILE: coverage-aware-qdrant-hybrid-v2

  worker:
    image: vidlens-backend:local
    environment:
      EVIDENCE_RETRIEVER_PROFILE: coverage-aware-qdrant-hybrid-v2

  mcp:
    image: vidlens-backend:local

  web:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      api:
        condition: service_healthy
