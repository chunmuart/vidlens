name: vidlens

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: media_db
    ports:
      - "3307:3306"
    volumes:
      - vidlens_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "6333:6333"
    volumes:
      - vidlens_qdrant:/qdrant/storage

  rmqnamesrv:
    image: apache/rocketmq:4.9.4
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rmqbroker:
    image: apache/rocketmq:4.9.4
    command: sh mqbroker -n rmqnamesrv:9876
    environment:
      NAMESRV_ADDR: rmqnamesrv:9876
    depends_on:
      - rmqnamesrv
    ports:
      - "10909:10909"
      - "10911:10911"

  api:
    build: ./backend
    ports:
      - "9090:9090"
    environment: &app_environment
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/media_db?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      ROCKETMQ_NAMESERVER: rmqnamesrv:9876
      ROCKETMQ_TOPIC: video-analysis-topic
      BILIBILI_IMPORT_ENABLED: "true"
      BILIBILI_MAX_DURATION_SECONDS: ${BILIBILI_MAX_DURATION_SECONDS:-900}
      BILIBILI_MAX_FILE_BYTES: "536870912"
      BILIBILI_IMPORT_ATTEMPTS: "3"
      MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-900}
      JWT_SECRET: change-this-before-deploying
      AUTO_CREATE_SCHEMA: "false"
      UPLOAD_ROOT: /data/uploads
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-flash}
      AI_THINKING_MODE: ${AI_THINKING_MODE:-disabled}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-180}
      AI_INPUT_COST_PER_MILLION_TOKENS: ${AI_INPUT_COST_PER_MILLION_TOKENS:-0}
      AI_OUTPUT_COST_PER_MILLION_TOKENS: ${AI_OUTPUT_COST_PER_MILLION_TOKENS:-0}
      AI_CACHE_HIT_INPUT_COST_PER_MILLION_TOKENS: ${AI_CACHE_HIT_INPUT_COST_PER_MILLION_TOKENS:-0}
      AGENT_MAX_TOOL_STEPS: ${AGENT_MAX_TOOL_STEPS:-8}
      AGENT_HISTORY_MAX_MESSAGES: ${AGENT_HISTORY_MAX_MESSAGES:-200}
      AGENT_CONTEXT_KEEP_TURNS: ${AGENT_CONTEXT_KEEP_TURNS:-4}
      AGENT_CONTEXT_MAX_CHARS: ${AGENT_CONTEXT_MAX_CHARS:-6000}
      AGENT_CONTEXT_OLDER_USER_CHARS: ${AGENT_CONTEXT_OLDER_USER_CHARS:-300}
      AGENT_CONTEXT_OLDER_ASSISTANT_CHARS: ${AGENT_CONTEXT_OLDER_ASSISTANT_CHARS:-80}
      AGENT_CONTEXT_SUMMARY_LINES: ${AGENT_CONTEXT_SUMMARY_LINES:-12}
      AGENT_PIPELINE_VERSION: ${AGENT_PIPELINE_VERSION:-structured-v5}
      EVIDENCE_RETRIEVER_PROFILE: ${EVIDENCE_RETRIEVER_PROFILE:-coverage-aware-qdrant-hybrid-v2}
      EVIDENCE_RETRIEVAL_FALLBACK_ENABLED: ${EVIDENCE_RETRIEVAL_FALLBACK_ENABLED:-true}
      EVIDENCE_ABSTENTION_ENABLED: ${EVIDENCE_ABSTENTION_ENABLED:-true}
      EVIDENCE_MIN_DENSE_SCORE: ${EVIDENCE_MIN_DENSE_SCORE:-0.45}
      EVIDENCE_MIN_LEXICAL_SCORE: ${EVIDENCE_MIN_LEXICAL_SCORE:-0.18}
      EVIDENCE_EMBEDDING_PROVIDER: ${EVIDENCE_EMBEDDING_PROVIDER:-cloud}
      EVIDENCE_EMBEDDING_BASE_URL: ${EVIDENCE_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EVIDENCE_EMBEDDING_API_KEY: ${EVIDENCE_EMBEDDING_API_KEY:-}
      EVIDENCE_EMBEDDING_MODEL: ${EVIDENCE_EMBEDDING_MODEL:-text-embedding-v4}
      EVIDENCE_EMBEDDING_DIMENSIONS: ${EVIDENCE_EMBEDDING_DIMENSIONS:-1024}
      EVIDENCE_EMBEDDING_CLOUD_BATCH_SIZE: ${EVIDENCE_EMBEDDING_CLOUD_BATCH_SIZE:-10}
      EVIDENCE_EMBEDDING_TIMEOUT_SECONDS: ${EVIDENCE_EMBEDDING_TIMEOUT_SECONDS:-60}
      EVIDENCE_EMBEDDING_MODEL_DIR: /data/models/retrieval/bge-small-zh-v1.5
      EVIDENCE_EMBEDDING_ALLOW_DOWNLOAD: ${EVIDENCE_EMBEDDING_ALLOW_DOWNLOAD:-true}
      EVIDENCE_EMBEDDING_CPU_THREADS: ${EVIDENCE_EMBEDDING_CPU_THREADS:-2}
      EVIDENCE_EMBEDDING_BATCH_SIZE: ${EVIDENCE_EMBEDDING_BATCH_SIZE:-32}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-vidlens_evidence_v1}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-10}
      AGENT_MAX_ROUNDS: ${AGENT_MAX_ROUNDS:-12}
      AGENT_MAX_ESTIMATED_TOKENS: ${AGENT_MAX_ESTIMATED_TOKENS:-60000}
      AGENT_MAX_DURATION_MS: ${AGENT_MAX_DURATION_MS:-180000}
      AGENT_MAX_ESTIMATED_COST: ${AGENT_MAX_ESTIMATED_COST:-0}
      CHECKPOINT_ENABLED: ${CHECKPOINT_ENABLED:-1}
      EVIDENCE_PARALLEL_ENABLED: ${EVIDENCE_PARALLEL_ENABLED:-true}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ASR_PROVIDER: ${ASR_PROVIDER:-auto}
      ASR_BASE_URL: ${ASR_BASE_URL:-}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_MODEL: ${ASR_MODEL:-}
      ASR_REQUEST_TIMEOUT_SECONDS: ${ASR_REQUEST_TIMEOUT_SECONDS:-60}
      ASR_POLL_TIMEOUT_SECONDS: ${ASR_POLL_TIMEOUT_SECONDS:-600}
      ASR_POLL_INTERVAL_SECONDS: ${ASR_POLL_INTERVAL_SECONDS:-2}
      ASR_LOCAL_FALLBACK_ENABLED: ${ASR_LOCAL_FALLBACK_ENABLED:-false}
      OCR_PROVIDER: ${OCR_PROVIDER:-local}
      OCR_BASE_URL: ${OCR_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      OCR_API_KEY: ${OCR_API_KEY:-}
      OCR_MODEL: ${OCR_MODEL:-qwen3.5-ocr}
      OCR_REQUEST_TIMEOUT_SECONDS: ${OCR_REQUEST_TIMEOUT_SECONDS:-60}
      OCR_MAX_TOKENS: ${OCR_MAX_TOKENS:-4096}
      LOCAL_ASR_ENABLED: ${LOCAL_ASR_ENABLED:-true}
      LOCAL_ASR_MODEL: ${LOCAL_ASR_MODEL:-base}
      LOCAL_ASR_MODEL_ROOT: ${LOCAL_ASR_MODEL_ROOT:-/data/models}
      LOCAL_ASR_DEVICE: ${LOCAL_ASR_DEVICE:-cpu}
      LOCAL_ASR_COMPUTE_TYPE: ${LOCAL_ASR_COMPUTE_TYPE:-int8}
      LOCAL_ASR_CPU_THREADS: ${LOCAL_ASR_CPU_THREADS:-4}
      LOCAL_ASR_LANGUAGE: ${LOCAL_ASR_LANGUAGE:-zh}
      LOCAL_ASR_BEAM_SIZE: ${LOCAL_ASR_BEAM_SIZE:-5}
      LOCAL_ASR_VAD_FILTER: ${LOCAL_ASR_VAD_FILTER:-true}
      LOCAL_ASR_PRELOAD: ${LOCAL_ASR_PRELOAD:-true}
      LOCAL_ASR_RELEASE_BEFORE_OCR: ${LOCAL_ASR_RELEASE_BEFORE_OCR:-true}
      LOCAL_ASR_INITIAL_PROMPT: ${LOCAL_ASR_INITIAL_PROMPT:-}
      LOCAL_ASR_HOTWORDS: ${LOCAL_ASR_HOTWORDS:-}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_INTERVAL_SECONDS: ${OCR_INTERVAL_SECONDS:-15}
      PADDLEOCR_MODEL_ROOT: ${PADDLEOCR_MODEL_ROOT:-/data/models/paddlex}
      PADDLEOCR_MODEL_SOURCE: ${PADDLEOCR_MODEL_SOURCE:-bos}
      PADDLEOCR_DETECTION_MODEL: ${PADDLEOCR_DETECTION_MODEL:-PP-OCRv5_mobile_det}
      PADDLEOCR_RECOGNITION_MODEL: ${PADDLEOCR_RECOGNITION_MODEL:-PP-OCRv5_mobile_rec}
      PADDLEOCR_DEVICE: ${PADDLEOCR_DEVICE:-cpu}
      PADDLEOCR_CPU_THREADS: ${PADDLEOCR_CPU_THREADS:-4}
      PADDLEOCR_ENABLE_MKLDNN: ${PADDLEOCR_ENABLE_MKLDNN:-true}
      PADDLEOCR_CONFIDENCE_THRESHOLD: ${PADDLEOCR_CONFIDENCE_THRESHOLD:-0.65}
      PADDLEOCR_DEDUP_THRESHOLD: ${PADDLEOCR_DEDUP_THRESHOLD:-0.88}
      PADDLEOCR_MIN_TEXT_LENGTH: ${PADDLEOCR_MIN_TEXT_LENGTH:-1}
      PADDLEOCR_MAX_FRAMES: ${PADDLEOCR_MAX_FRAMES:-60}
      PADDLEOCR_FRAME_MAX_WIDTH: ${PADDLEOCR_FRAME_MAX_WIDTH:-960}
      PADDLEOCR_PROCESS_TIMEOUT_SECONDS: ${PADDLEOCR_PROCESS_TIMEOUT_SECONDS:-600}
    volumes:
      - vidlens_uploads:/data/uploads
      - vidlens_models:/data/models
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rmqbroker:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ./backend
    command: python -m vidlens.worker
    environment:
      <<: *app_environment
    volumes:
      - vidlens_uploads:/data/uploads
      - vidlens_models:/data/models
    depends_on:
      api:
        condition: service_healthy
      rmqbroker:
        condition: service_started
    mem_limit: 2560m

  mcp:
    build: ./backend
    command: python -m vidlens.mcp_server --transport streamable-http --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      VIDLENS_API_URL: http://api:9090
      VIDLENS_MCP_PUBLIC_URL: http://localhost:8001/mcp
      VIDLENS_MCP_ISSUER_URL: http://localhost:9090
    depends_on:
      api:
        condition: service_healthy

volumes:
  vidlens_mysql:
  vidlens_uploads:
  vidlens_models:
  vidlens_qdrant:
